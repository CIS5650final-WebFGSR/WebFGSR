<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WebFGSR - Super Resolution in WebGPU</title>
        <link rel="icon" href="data:," />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #101214;
                color: #e8eaed;
                font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                overflow: hidden;
            }
            #stage {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            /* The canvas backbuffer is pinned to an exact pixel size by the app;
               CSS only letterboxes it into the window. */
            #renderCanvas {
                max-width: 100%;
                max-height: 100%;
                outline: none;
                touch-action: none;
                display: block;
            }
            #hud {
                position: fixed;
                left: 12px;
                top: 12px;
                padding: 10px 12px;
                background: rgba(16, 18, 20, 0.78);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 8px;
                font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
                white-space: pre;
                pointer-events: none;
                min-width: 250px;
            }
            #labels {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 14px;
                display: flex;
                justify-content: space-between;
                padding: 0 16px;
                pointer-events: none;
                font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
            }
            #labels span {
                padding: 6px 10px;
                background: rgba(16, 18, 20, 0.78);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 6px;
            }
            #fatal {
                position: fixed;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                padding: 32px;
                text-align: center;
                font-size: 16px;
                line-height: 1.5;
                background: #101214;
                white-space: pre-wrap;
            }
            body.capture #hud,
            body.capture #labels {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="stage"><canvas id="renderCanvas"></canvas></div>
        <div id="hud"></div>
        <div id="labels"><span id="labelLeft"></span><span id="labelRight"></span></div>
        <div id="fatal"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
